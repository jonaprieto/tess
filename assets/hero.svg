  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B79FF"/><stop offset="1" stop-color="#3FD0E4"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0E15"/><stop offset="1" stop-color="#121A28"/></linearGradient>
  <radialGradient id="halo" cx="0.75" cy="0.35" r="0.6"><stop offset="0" stop-color="#5E5CE6" stop-opacity="0.18"/><stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity="0.05"/></pattern>
