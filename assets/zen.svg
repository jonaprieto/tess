<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="Zen mode: the focused window fills its screen, the others go dark, with a pomodoro timer">
<title>Zen mode: the focused window fills its screen, the others go dark, with a pomodoro timer</title>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7B79FF"/><stop offset="1" stop-color="#3FD0E4"/>
